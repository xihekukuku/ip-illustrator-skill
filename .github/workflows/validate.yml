name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python skills/personal-ip-article-illustrations/scripts/validate_skill.py
          skills/personal-ip-article-illustrations
      - run: python skills/personal-ip-article-illustrations/scripts/public_release_check.py .
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
